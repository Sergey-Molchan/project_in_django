{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0">Подтверждение Email</h4>
                </div>
                <div class="card-body text-center">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                    <p>Ваш email успешно подтвержден!</p>
                    <a href="{% url 'users:login' %}" class="btn btn-success">Войти в систему</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
