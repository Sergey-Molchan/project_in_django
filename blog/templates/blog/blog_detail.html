{% extends 'base.html' %}

{% block content %}
<h1>{{ blog.title }}</h1>
<p>{{ blog.created_at }} | Просмотров: {{ blog.views_count }}</p>

{% if blog.image %}
<img src="{{ blog.image.url }}" alt="{{ blog.title }}">
{% endif %}

<div>{{ blog.content }}</div>

<a href="{% url 'blog_update' blog.pk %}">Редактировать</a>
<a href="{% url 'blog_delete' blog.pk %}">Удалить</a>
<a href="{% url 'blog_list' %}">Назад к списку</a>
{% endblock %}
