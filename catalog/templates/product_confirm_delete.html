<!-- catalog/templates/catalog/product_confirm_delete.html -->
{% extends 'base.html' %}

{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Удаление продукта</h4>
                </div>
                <div class="card-body">
                    <p class="lead">Вы уверены, что хотите удалить продукт <strong>"{{ object.name }}"</strong>?</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">Да, удалить</button>
                            <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
