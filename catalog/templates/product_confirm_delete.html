<!-- catalog/templates/catalog/product_confirm_delete.html -->
{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Удаление продукта</h4>
                </div>
                <div class="card-body">
                    <p class="lead">Вы уверены, что хотите удалить продукт <strong>"{{ object.name }}"</strong>?</p>

                    {% if object.image %}
                    <div class="text-center mb-3">
                        <img src="{{ object.image.url }}" alt="{{ object.name }}" class="img-fluid" style="max-height: 200px;">
                    </div>
                    {% endif %}

                    <p class="text-muted">Это действие нельзя отменить. Все данные о продукте будут удалены.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash"></i> Да, удалить
                            </button>
                            <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
